<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Obscura: name one thing per prompt. The rarer your answer, the deeper you drop.">
<meta name="theme-color" content="#050d08">
<title>Obscura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: a retro CRT field console for a rainforest trek. One centred column of bevelled panels over a pixel sea; in a round it splits into the answer desk and a depth gauge with one lane per diver. Single dark look by choice. */
:root {
  color-scheme: dark;
  --ink: #050d08;
  --deep: #0b2414;
  --panel: rgba(7, 18, 11, 0.84);
  --abyss: #050d08;
  --pip: #ffd166;
  --edge: #1f4a30;
  --edge-dark: #06110a;
  --btn: #11261a;
  --text: #f0f7e4;
  --muted: #8fae8f;
  --cyan: #7dffb0;
  --pink: #ff7a45;
  --gold: #ffe08a;
  --orange: #ffb35c;
  --school: #7deaff;
  --green: #62f5b0;
  --violet: #bfa7ff;
  --plank: #d7e1f2;
  --coral: #ff4d4d;
  --blue: #7fb4ff;
  --font: "VT323", ui-monospace, "Courier New", monospace;
  --snap: cubic-bezier(0.2, 1.6, 0.4, 1);
}
* { box-sizing: border-box; }
html { background: var(--abyss); }
body {
  background: var(--deep);
  color: var(--text);
  font: 400 20px/1.25 var(--font);
  letter-spacing: 0.03em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
  min-height: 100dvh;
  overflow-x: hidden;
}
#sea { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
#crt { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0.45; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px); }
#vig { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(at 50% 45%, transparent 55%, rgba(2, 8, 4, 0.85) 100%); }
#edge { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 0.3s; box-shadow: inset 0 0 90px 18px rgba(255, 122, 69, 0.6); }
#edge.hot { opacity: 1; animation: glow 0.7s ease-in-out infinite; }
#app { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; }
section { display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p, ul, ol { margin: 0; font-weight: 400; }
ul, ol { padding: 0; list-style: none; }

/* type */
.logo { font-size: clamp(54px, 16vw, 88px); line-height: 0.86; letter-spacing: 0.04em; text-align: center; color: var(--text); text-shadow: -4px 3px 0 #ff7a45, 4px -3px 0 rgba(125, 255, 176, 0.85), 0 0 30px rgba(125, 255, 176, 0.35); animation: flicker 5s step-end infinite; }
.logo .word { display: inline-block; margin: 0 0.14em; }
.logo .word span { display: inline-block; animation: bob 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.27s); }
.tag { text-align: center; color: var(--cyan); font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase;
  text-shadow: 0 2px 0 rgba(5, 13, 8, 0.4), 0 0 12px rgba(125, 255, 176, 0.5); }
h2 { font-size: clamp(34px, 8vw, 52px); line-height: 0.95; letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance;
  text-shadow: -2px 1px 0 var(--pink), 2px -1px 0 rgba(125, 255, 176, 0.85); }
h3 { font-size: 16px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 6px 0 8px; }
.eyebrow { font-size: 17px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 8px rgba(125, 255, 176, 0.45); }
.lede { text-align: center; max-width: 34ch; margin: 0 auto; color: var(--text); text-shadow: 0 1px 0 rgba(5, 13, 8, 0.35); }
.note, .fine { color: var(--muted); font-size: 17px; letter-spacing: 0.06em; }
.fine { text-align: center; font-size: 15px; }
.msg { color: var(--pink); text-align: center; }
label { font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

/* panels */
.panel { background: var(--panel) repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
  box-shadow: 0 0 0 2px var(--edge-dark), 0 0 0 4px var(--edge), 0 0 40px rgba(0, 0, 0, 0.45);
  padding: 14px 16px 14px; margin: 4px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; font-size: 16px; letter-spacing: 0.22em; text-transform: uppercase; }
.ph::after { content: ""; flex: 1; order: 2; border-top: 1px dashed #2f6b45; }
.ph em { order: 3; font-style: normal; color: var(--muted); letter-spacing: 0.14em; }

/* controls */
button, input, select { font: inherit; color: inherit; border-radius: 0; }
button { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); background: var(--btn); border: 0;
  padding: 12px 22px 10px; margin: 5px 5px 10px; cursor: pointer; align-self: flex-start;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px #2f6b45, 0 5px 0 5px #123a22; transition: transform 0.06s, filter 0.1s; }
button:hover:not(:disabled) { filter: brightness(1.25); }
button:active:not(:disabled) { transform: translateY(4px); animation: none; }
button:disabled { opacity: 0.4; cursor: not-allowed; animation: none !important; }
button.go { align-self: stretch; margin: 6px 6px 12px;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--cyan), 0 6px 0 6px #123a22, 0 0 26px rgba(125, 255, 176, 0.3);
  animation: btnbob 1.9s ease-in-out infinite; }
button.pink { background: #ff7a45; color: #050d08; box-shadow: 0 0 0 2px #050d08, 0 3px 0 2px #7d2f12, 0 0 16px rgba(255, 122, 69, 0.45); }
button.small { font-size: 16px; letter-spacing: 0.09em; padding: 6px 12px 5px; margin: 4px; background: #0d2416; color: var(--muted); box-shadow: 0 0 0 2px #050d08, 0 0 0 4px #1f4a30, 0 4px 0 4px #0a1c10; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
input, select { background: rgba(10, 26, 16, 0.9); border: 2px solid var(--edge); padding: 9px 10px 7px; font-size: 22px; letter-spacing: 0.04em; min-width: 0; width: 100%; }
input:focus, select:focus { outline: 0; border-color: var(--cyan); box-shadow: 0 0 14px rgba(125, 255, 176, 0.35); }
input::placeholder { color: #4d6b52; }
input:disabled { opacity: 0.5; }

/* home */
.home { max-width: 440px; margin: 0 auto; gap: 14px; padding-top: 22px; }
.joinrow { display: flex; gap: 6px; align-items: stretch; }
.joinrow input { letter-spacing: 0.4em; text-transform: uppercase; }
.joinrow button { margin: 3px 3px 8px 6px; align-self: stretch; }
.legend { justify-content: center; }

/* chips */
.chips, .legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 8px; align-items: baseline; padding: 3px 9px 2px; margin: 2px; font-size: 19px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--c); background: rgba(17, 38, 26, 0.95); box-shadow: 0 0 0 2px var(--c), 0 0 14px color-mix(in srgb, var(--c) 60%, transparent); text-shadow: 0 0 10px var(--c); }
.chip b { font-weight: 400; font-size: 15px; color: var(--muted); text-shadow: none; }
.t-krill { --c: var(--plank); } .t-schooler { --c: var(--school); } .t-rare { --c: var(--coral); } .t-deepcut { --c: var(--violet); } .t-krillion { --c: var(--gold); }
.chip.t-krillion { animation: goldpulse 1s ease-in-out infinite; }
.chip.bloom { animation: bloom 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
.chip.bloom.t-krillion { animation: bloom 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both, goldpulse 1s ease-in-out 0.55s infinite; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; }
.brand { font-size: 26px; letter-spacing: 0.08em; text-shadow: -2px 1px 0 var(--pink), 2px -1px 0 rgba(125, 255, 176, 0.85); }
.code { font-size: 16px; letter-spacing: 0.2em; color: var(--cyan); margin-right: auto; text-transform: uppercase; }
.bar button { align-self: center; }

/* lobby */
.bigcode { display: flex; align-items: center; gap: 14px; }
.bigcode span { font-size: clamp(56px, 16vw, 88px); line-height: 0.9; letter-spacing: 0.2em; color: var(--gold); text-shadow: 0 0 22px rgba(255, 224, 138, 0.5); }
.bigcode button { align-self: center; }
.opts { display: flex; flex-wrap: wrap; gap: 12px; }
.opt { display: flex; flex-direction: column; gap: 4px; flex: 1 1 150px; }

/* boards */
.board, .ranks { display: flex; flex-direction: column; }
.board li, .ranks li { display: flex; align-items: center; gap: 10px; padding: 6px 2px 5px; border-bottom: 1px dashed var(--edge); }
.board li:last-child, .ranks li:last-child { border-bottom: 0; }
.board li.me .who, .ranks li.me .who { color: var(--cyan); }
.dot { width: 12px; height: 12px; flex: none; box-shadow: 0 0 0 2px var(--ink); }
.who { min-width: 0; overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: 0.08em; }
.count { color: var(--muted); font-size: 16px; margin-left: auto; text-align: right; letter-spacing: 0.08em; }
.depth { font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-block; }
.who + .depth { margin-left: auto; }
.depth.slam { animation: slam 0.5s var(--snap); }
.ranks li { padding: 10px 2px; flex-wrap: wrap; font-size: 22px; }
.ranks li:first-child .depth { color: var(--gold); text-shadow: 0 0 16px rgba(255, 224, 138, 0.7); }

/* topic pick */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; padding: 6px; }
.card { align-self: stretch; margin: 0; text-align: left; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 6px; letter-spacing: 0.05em; text-transform: none;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px #2f6b45, 0 6px 0 5px #123a22; }
.card strong { font-weight: 400; font-size: 32px; line-height: 0.95; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text); }
.card span { color: var(--muted); font-size: 17px; }
.card i { font-style: normal; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); margin-top: auto; padding-top: 8px; }
.card:hover:not(:disabled), .card:focus-visible { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--cyan), 0 6px 0 6px #123a22, 0 0 26px rgba(125, 255, 176, 0.3); filter: none; }
.card:disabled { opacity: 0.75; }

/* round */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.topic { position: relative; text-align: center; padding-block: 20px 16px; gap: 6px; background: rgba(17, 38, 26, 0.93); box-shadow: 0 0 0 3px rgba(125, 255, 176, 0.25), 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 34px rgba(5, 13, 8, 0.6); }
.hud { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin: 0 4px; }
.hudbox { background: linear-gradient(rgba(17, 38, 26, 0.92), rgba(10, 26, 16, 0.92)); box-shadow: 0 0 0 2px #06110a, 0 0 0 4px #1f4a30, inset 0 2px 0 rgba(240, 247, 228, 0.06); padding: 6px 12px 4px; min-width: 96px; display: flex; flex-direction: column; }
.hudbox.right { text-align: right; }
.hudbox span { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
.hudbox b { font-weight: 400; font-size: 30px; line-height: 1; color: #7dffb0; text-shadow: 0 0 12px rgba(125, 255, 176, 0.55); display: inline-block; font-variant-numeric: tabular-nums; }
.hudbox.right b { color: #ff7a45; text-shadow: 0 0 12px rgba(255, 122, 69, 0.5); }
.hudbox b.slam { animation: slam 0.5s var(--snap); }
.pips { display: flex; gap: 5px; padding-top: 8px; }
.pips i { width: 16px; height: 16px; background: #12301e; box-shadow: 0 0 0 2px #06110a; }
.pips i.done { background: var(--pip); box-shadow: 0 0 0 2px #06110a, 0 0 8px rgba(255, 209, 102, 0.7); }
.pips i.now { background: #ff7a45; box-shadow: 0 0 0 2px #06110a, 0 0 10px rgba(255, 122, 69, 0.85); }
.eyebrow.pinkish { color: var(--pink); text-shadow: 0 0 8px rgba(255, 122, 69, 0.45); }
.air { height: 5px; background: #091a0f; box-shadow: 0 0 0 2px #06110a; margin: 2px; }
#airbar { height: 100%; background: #7dffb0; }
#airbar.low { background: #ff7a45; }
.clock { text-align: center; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--pink); }
.clock:empty { display: none; }
.clock.big { font-size: 120px; line-height: 1; color: var(--gold); text-shadow: 0 0 30px rgba(255, 224, 138, 0.7); }
.clock.pop { animation: banner 0.5s var(--snap) backwards; }
.ans { display: flex; gap: 10px; align-items: flex-start; position: relative; margin: 0 4px; --rc: var(--cyan); }
.ans.low { --rc: var(--pink); }
.ring { flex: none; width: 58px; height: 58px; margin: 4px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; color: var(--rc); text-shadow: 0 0 12px var(--rc); background: radial-gradient(circle, rgba(10, 26, 16, 0.95) 40%, rgba(17, 38, 26, 0.9) 100%); box-shadow: 0 0 0 2px #06110a, 0 0 0 4px #1f4a30, 0 0 18px rgba(125, 255, 176, 0.2), inset 0 0 14px rgba(125, 255, 176, 0.14); position: relative; }
.ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(var(--rc) var(--f, 360deg), transparent 0); -webkit-mask: radial-gradient(closest-side, transparent 80%, #000 82%); mask: radial-gradient(closest-side, transparent 80%, #000 82%); opacity: 0.85; }
.ans.low .ring { animation: glow 0.5s steps(2) infinite; }
.field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.ans input { font-size: 26px; padding-block: 12px 10px; border-color: #1f4a30; }
.ans button { align-self: flex-start; margin: 5px 5px 0 4px; padding-block: 14px 12px; }
.ans.low input { border-color: #ff7a45; }
.ans.jolt { animation: jolt 0.4s linear; }
.rise { position: absolute; left: 50%; top: -36px; z-index: 2; font-size: 30px; letter-spacing: 0.12em; white-space: nowrap; pointer-events: none; color: var(--c);
  text-shadow: 0 0 14px var(--c); animation: rise 1.5s ease-out forwards; }
.fb { min-height: 2.6em; text-align: center; letter-spacing: 0.08em; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
.fb p { font-size: 22px; display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
.spr { image-rendering: pixelated; flex: none; vertical-align: middle; }
.chip .spr { align-self: center; filter: drop-shadow(0 0 4px var(--c)); }
.mascot { position: absolute; top: 10px; right: 14px; animation: swim 2.6s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255, 122, 69, 0.6)); }
.fb small { font-size: 15px; letter-spacing: 0.16em; color: var(--muted); }
.fb.pop { animation: banner 0.35s var(--snap) backwards; }
.f-miss, .f-dup { color: #ffb35c; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6); }
.topic h2 { text-transform: none; letter-spacing: 0.03em; text-shadow: 0 0 16px rgba(240, 247, 228, 0.25), 2px 0 0 rgba(255, 122, 69, 0.18), -2px 0 0 rgba(125, 255, 176, 0.18); }
.f-fix { color: var(--cyan); text-shadow: 0 0 10px rgba(125, 255, 176, 0.45); }
.f-krill { color: var(--plank); } .f-schooler { color: var(--school); } .f-rare { color: var(--coral); } .f-deepcut { color: var(--violet); } .f-krillion { color: var(--gold); }
#catch { justify-content: center; margin: 0 4px; }

/* depth gauge */
.gauge { position: sticky; top: 12px; margin: 4px; height: min(560px, 76vh); min-height: 380px; overflow: hidden;
  box-shadow: 0 0 0 2px var(--edge-dark), 0 0 0 4px var(--edge), 0 0 40px rgba(0, 0, 0, 0.45);
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px),
    linear-gradient(to bottom, #3f9a63 0 13.5%, #1f6a41 13.5% 30%, #124528 30% 60%, #0a2a18 60% 74%, #04120a 74% 100%); }
.tick { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(240, 247, 228, 0.28); display: flex; justify-content: space-between; gap: 6px; padding: 1px 6px;
  font-size: 13px; letter-spacing: 0.1em; color: rgba(240, 247, 228, 0.62); white-space: nowrap; }
.tick i { font-style: normal; }
.tick.floor { border-top: 0; transform: translateY(-100%); border-bottom: 2px solid var(--gold); color: var(--gold); }
.lanes { position: absolute; inset: 22px 8px 24px; }
.diver { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; transition: top 0.9s cubic-bezier(0.5, 0, 0.85, 0.6), left 0.3s; animation: swim 2.6s ease-in-out infinite; }
.diver span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 0 var(--ink); }
.diver.me { z-index: 1; }
.diver.me img { filter: drop-shadow(0 0 6px rgba(240, 247, 228, 0.9)); }

/* results */
.results { display: flex; flex-direction: column; gap: 14px; }
.haul header { display: flex; align-items: center; gap: 10px; }
.haul header strong { font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; }
.haul.me header strong { color: var(--cyan); }
.haul .depth { margin-left: auto; color: var(--gold); }

/* entrances: only while a screen is fresh, so live updates do not replay them */
.enter h2 { animation: banner 0.7s var(--snap) backwards; }
.enter .card, .enter .haul, .enter .topic, .home .panel { animation: cardin 0.7s var(--snap) backwards; }
.enter .card:nth-child(2), .enter .haul:nth-child(2), .home .panel:nth-of-type(2) { animation-delay: 0.1s; }
.enter .card:nth-child(3), .enter .haul:nth-child(3), .home .panel:nth-of-type(3) { animation-delay: 0.2s; }
.enter .haul:nth-child(n+4), .home .panel:nth-of-type(n+4) { animation-delay: 0.3s; }
.enter .haul .chip { animation: sink 0.5s ease-out both; animation-delay: calc(0.4s + var(--n, 0) * 0.06s); }
.enter .haul .chip.t-krillion { animation: sink 0.5s ease-out both, goldpulse 1s ease-in-out 1.5s infinite; animation-delay: calc(0.4s + var(--n, 0) * 0.06s), 1.5s; }
.enter .go, .enter .ranks li { animation: risein 0.5s var(--snap) backwards; animation-delay: 0.5s; }
#app.shake { animation: stageshake 0.5s linear; }
#crt.zap { animation: zap 0.28s steps(3); }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes flicker { 0%, 93%, 95.5%, 100% { opacity: 1; } 93.6% { opacity: 0.7; } 94.4% { opacity: 0.94; } 95% { opacity: 0.62; } }
@keyframes btnbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
@keyframes swim { 0%, 100% { transform: translateY(0) rotate(-4deg); } 25% { transform: translateY(-5px) rotate(2deg); } 50% { transform: translateY(-1px) rotate(5deg); } 75% { transform: translateY(-6px) rotate(-2deg); } }
@keyframes cardin { 0% { opacity: 0; transform: translateY(46px) scale(0.92); } }
@keyframes banner { 0% { opacity: 0; transform: scale(0.5); } }
@keyframes risein { 0% { opacity: 0; transform: translateY(30px); } }
@keyframes sink { 0% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes bloom { 0% { opacity: 0; filter: brightness(2.5); transform: scale(0.6); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; filter: brightness(1); transform: scale(1); } }
@keyframes goldpulse { 0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(255, 224, 138, 0.45); } 50% { box-shadow: 0 0 0 1px #ffe9a8, 0 0 30px rgba(255, 224, 138, 0.9); } }
@keyframes slam { 0% { transform: scale(1); } 35% { color: var(--gold); text-shadow: 0 0 26px rgba(255, 224, 138, 0.9); transform: scale(1.4) rotate(-2deg); } 100% { transform: scale(1); } }
@keyframes jolt { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 45% { transform: translateX(7px); } 70% { transform: translateX(-4px); } 88% { transform: translateX(2px); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -38px) scale(1); } }
@keyframes stageshake { 0%, 100% { transform: none; } 12% { transform: translate(-10px, 5px) rotate(-0.6deg); } 26% { transform: translate(9px, -6px) rotate(0.5deg); } 42% { transform: translate(-7px, 4px) rotate(-0.35deg); } 58% { transform: translate(6px, -3px) rotate(0.25deg); } 76% { transform: translate(-3px, 2px) rotate(-0.1deg); } }
@keyframes zap { 0% { opacity: 0.9; transform: translateY(0); } 33% { opacity: 0.2; transform: translateY(2px); } 66% { opacity: 0.7; transform: translateY(-1px); } 100% { opacity: 0.45; transform: none; } }
@keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

@media (max-width: 640px) {
  .split { grid-template-columns: minmax(0, 1fr) 76px; gap: 10px; }
  .tick span { display: none; }
  .gauge { min-height: 320px; }

/* the landing, staged: the creature slams in, its name is stamped out letter by letter, the points tick up and fly to the score */
.landed { animation: none; }

.fly { animation: fly 0.78s cubic-bezier(.55, 0, .3, 1) both; }
@keyframes fly { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 16% { opacity: 1; transform: translate(-50%, -95%) scale(1.25); } 100% { opacity: 0.95; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.5); } }
@media (prefers-reduced-motion: reduce) { .landed .tname span, .landed .bigicon { animation: none; } }
/* restraint pass, after watching Krillion's descent frame by frame: small crisp pieces, faint glows, nothing shouting */

/* the dark closes in, as in Krillion: the edges tighten while you fall, and the whole scene dims behind the result */
html::after, body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; }
html::after { background: radial-gradient(ellipse 70% 62% at 50% 42%, rgba(2, 8, 5, 0) 0, rgba(2, 8, 5, 0.36) 62%, rgba(2, 8, 5, 0.86) 100%); transition: opacity 1.2s cubic-bezier(.22, 1, .36, 1); }
body::after { background: radial-gradient(ellipse 95% 85% at 50% 36%, rgba(3, 10, 6, 0.7) 0, rgba(3, 9, 6, 0.9) 58%, rgba(2, 6, 4, 0.97) 100%); transition: opacity 0.9s cubic-bezier(.22, 1, .36, 1); }
html:has(body.sinking)::after { opacity: 1; }
body.quiet.dive::after { opacity: 1; }
.landed::after { display: none; }
/* Krillion's landing, matched: a spotlight on the falling answer, the result popping in with a bounce, the lights back up after */
html::after { display: none; }
body::after { background: radial-gradient(circle at 50% 30%, rgba(2, 8, 5, 0) min(200px, 30vw), rgba(2, 8, 5, 0.72) min(290px, 46vw), rgba(2, 8, 5, 0.96) min(460px, 78vw)); transition: opacity 0.9s cubic-bezier(.22, 1, .36, 1); }
body.quiet.dive::after { opacity: 0; }
body.spot.dive::after { opacity: 1; }
.landed { animation: banner 0.8s cubic-bezier(.2, 1.7, .4, 1) backwards; gap: 4px; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.5); } }
.landed .bigicon { width: 66px; height: 66px; filter: drop-shadow(0 0 20px var(--c)); animation: iconbob 2.6s ease-in-out infinite; margin-bottom: 6px; }
.landed.t-deepcut .bigicon, .landed.t-krillion .bigicon { width: 88px; height: 88px; }
.landed .tname { font-size: clamp(28px, 8.5vw, 44px); letter-spacing: 0.12em; text-shadow: 0 0 22px var(--c, transparent), 0 3px 0 #0009; }
.landed .tname span { animation: none; }
.landed .badges, .landed .tans, .landed .tname ~ .tans, .landed .tpts, .landed .note { animation: none; }
.landed .tans { font-size: 19px; letter-spacing: 0.08em; margin-top: 2px; }
.landed .tpts { font-size: 22px; margin-top: 4px; }
.landed .note { font-size: 14px; letter-spacing: 0.14em; margin-top: 4px; opacity: 1; }
.landed .go { animation: risein 0.5s cubic-bezier(.34, 1.56, .64, 1) backwards, btnbob 1.9s cubic-bezier(.65, 0, .35, 1) 0.9s infinite; margin-top: 26px; }
body.quiet #tierlines { opacity: 0 !important; transition: opacity 0.6s ease; }
/* Krillion's restraint, in Obscura's own forest: the prompt card lifts away as the answer drops, and the scene stays quiet */
@keyframes cardgone { 0% { opacity: 1; filter: none; transform: none; } 100% { opacity: 0; filter: blur(2px); transform: translateY(-28px) scale(0.9); } }
body.sinking .play .topic { animation: cardgone 0.6s ease-in 0.45s forwards; }

.board li.up { animation: rankup 0.9s cubic-bezier(.22, 1, .36, 1); }

.rival { position: fixed; top: max(66px, calc(env(safe-area-inset-top, 0px) + 56px)); left: 50%; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 8px 16px 6px; transform: translateX(-50%); background: rgba(7, 18, 11, 0.94); box-shadow: 0 0 0 2px #06110a, 0 0 0 4px var(--rc), 0 0 22px color-mix(in srgb, var(--rc) 35%, transparent); color: #f0f7e4; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; pointer-events: none; animation: rivalin 2.7s cubic-bezier(.22, 1, .36, 1) both; }
.rival b { color: var(--rc); font-weight: 400; }
.rival.big { font-size: 22px; color: var(--rc); animation-duration: 3.3s; }
@keyframes rivalin { 0% { opacity: 0; transform: translate(-50%, -14px) scale(0.9); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.haul.win { box-shadow: 0 0 0 3px #ffe08a, 0 0 26px rgba(255, 224, 138, 0.25); }
.chips .solo::after { content: "★"; color: #ffe08a; margin-left: 4px; font-size: 0.8em; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 6px 0 2px; }
.podium .pl { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 30%; max-width: 170px; text-align: center; }
.podium .who { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
.podium .p1 .who { color: #ffe08a; }
.podium .d { font-size: 16px; color: #f0f7e4; }
.podium .block { width: 100%; display: grid; place-items: center; font-size: 30px; color: #050d08; background: var(--mc); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), inset 0 -4px 0 rgba(0, 0, 0, 0.25); transform-origin: bottom; animation: podup 0.8s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.podium .p1 .block { height: 92px; animation-delay: 0.5s; } .podium .p2 .block { height: 66px; animation-delay: 0.25s; } .podium .p3 .block { height: 46px; }
@keyframes podup { 0% { transform: scaleY(0); } }
.podium .p1 .spr { filter: drop-shadow(0 0 14px #ffe08a); animation: iconbob 2.6s ease-in-out infinite; }
.awards li { display: flex; align-items: center; gap: 10px; padding: 8px 2px 7px; border-bottom: 1px dashed var(--edge); font-size: 17px; flex-wrap: wrap; }
.awards li:last-child { border-bottom: 0; }
.awards .k { min-width: 110px; color: #8fae8f; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.awards strong { font-weight: 400; color: #f0f7e4; text-transform: uppercase; letter-spacing: 0.08em; }

/* the overgrown title: pixel art shown big, vines swaying from where they hang */
.logo.grown { position: relative; width: 100%; max-width: 640px; margin: 0 auto -6%; text-shadow: none; animation: none; color: transparent; font-size: 0; line-height: 0; filter: drop-shadow(0 0 22px rgba(120, 230, 110, 0.22)); }
.logo.grown img { position: absolute; image-rendering: pixelated; pointer-events: none; -webkit-user-drag: none; }
.logo.grown .lw { inset: 0; width: 100%; height: 100%; }
.logo.grown .vine { transform-origin: 50% 0; animation: vinesway 4s ease-in-out infinite alternate; }
@keyframes vinesway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }
body.low .logo.grown .vine { animation: none; }
@media (prefers-reduced-motion: reduce) { .logo.grown .vine { animation: none; } }
/* answer box: Krillion's pink caret, a lit border while focused, and a rejected answer that shakes */
.ans input { caret-color: var(--pink); }
.ans input:focus { border-color: rgba(125, 255, 176, 0.65); }
